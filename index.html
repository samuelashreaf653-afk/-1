<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بوابة الطالب الأكاديمية</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ============ شاشة تسجيل الدخول ============ -->
    <section id="loginView" class="login">
        <div class="login-bg-overlay"></div>
        <form class="login-card" id="loginForm" autocomplete="off">
            <div class="brand">
                <div class="logo">🎓</div>
                <h1>بوابة الطالب الأكاديمية</h1>
                <p>اختر نوع الحساب ثم سجّل الدخول</p>
            </div>

            <!-- اختيار نوع الحساب من البداية -->
            <div class="role-tabs" id="roleTabs" role="tablist">
                <button type="button" class="role-tab active" data-role="student">🎓 طالب</button>
                <button type="button" class="role-tab" data-role="doctor">👨‍🏫 دكتور</button>
                <button type="button" class="role-tab" data-role="admin">🛠️ أدمن</button>
            </div>

            <div class="field">
                <label for="studentId" id="userLabel">الرقم الجامعي أو اسم المستخدم</label>
                <input id="studentId" type="text" placeholder="اكتب student أو 20230145" required />
            </div>
            <div class="field">
                <label for="password">كلمة المرور</label>
                <input id="password" type="password" placeholder="••••••" required />
            </div>

            <div class="error" id="loginError"></div>
            <button class="btn" type="submit">تسجيل الدخول</button>
            <p class="hint" id="loginHint"></p>
            <button type="button" class="link-btn" id="fillDemoBtn">⚡ تعبئة بيانات التجربة تلقائيًا</button>

            <div class="demo-note">
                🧪 <b>نسخة تجريبية (Frontend Demo)</b> — البيانات محفوظة في متصفحك فقط،
                وتسجيل الدخول والصلاحيات هنا لعرض الفكرة وليست آمنة أو جاهزة للاستخدام الفعلي.
                <button type="button" class="link-btn" id="resetDemoLogin">إعادة ضبط بيانات التجربة</button>
            </div>
        </form>
    </section>

    <!-- ============ واجهة المنصة (طالب / دكتور / أدمن) ============ -->
    <div id="portalView" class="portal hidden">
        <aside class="sidebar">
            <div class="side-brand">
                <div class="logo">🎓</div>
                <span>البوابة الأكاديمية<small id="sideRole">نظم معلومات الأعمال (BIS)</small></span>
            </div>
            <nav class="nav" id="nav"></nav>
            <button class="logout" id="logoutBtn">🚪 تسجيل الخروج</button>
        </aside>

        <main class="main">
           
            <div class="topbar">
                <div>
                    <h2 id="welcome">أهلاً بك</h2>
                    <p id="welcomeSub"></p>
                </div>
                <div class="avatar" id="avatar">أ</div>
            </div>
            <div id="content" class="content-area"></div>
        </main>
    </div>

    <div id="toastHost" class="toast-host" aria-live="polite"></div>
    <div id="modalHost"></div>

    <script src="js/lib/qrcode.js"></script>
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
    <script src="js/doctor.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/boot.js"></script>
</body>
</html>
